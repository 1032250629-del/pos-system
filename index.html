<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexPOS — Next-Gen Retail & Billing System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pos.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/inventory.css">
  <link rel="stylesheet" href="css/receipt.css">
</head>
<body>
  <div id="app-container">
    
    <!-- Sidebar Navigation -->
    <aside id="sidebar">
      <div class="brand-header">
        <div class="brand-icon">⚡</div>
        <div class="brand-title">Apex<span style="color: var(--primary-400);">POS</span></div>
        <span class="brand-tag">v2.0</span>
      </div>

      <ul class="nav-links">
        <li class="nav-item active">
          <button data-view="pos">
            <span class="nav-icon">🛒</span>
            <span>Billing Terminal</span>
            <span class="nav-shortcut-badge">F1</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-view="dashboard">
            <span class="nav-icon">📊</span>
            <span>Dashboard</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-view="inventory">
            <span class="nav-icon">📦</span>
            <span>Inventory</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-view="transactions">
            <span class="nav-icon">📜</span>
            <span>Sales History</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-view="customers">
            <span class="nav-icon">👥</span>
            <span>Customers CRM</span>
          </button>
        </li>
        <li class="nav-item admin-only">
          <button data-view="settings">
            <span class="nav-icon">⚙️</span>
            <span>Store Settings</span>
          </button>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="user-badge">
          <div class="user-avatar" id="header-user-avatar">AM</div>
          <div class="user-info">
            <span class="user-name" id="header-user-name">Alex Morgan</span>
            <span class="user-role" id="header-user-role">admin</span>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" id="btn-switch-user" title="Switch User / PIN" style="color: #FFF; font-size: 1.1rem;">
          🔄
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main id="main-content">
      
      <!-- Top Header -->
      <header id="top-header">
        <div class="header-left">
          <h1 class="page-title" id="header-page-title">POS Billing Terminal</h1>
        </div>
        <div class="header-right">
          <div class="server-status-pill offline" id="backend-status-pill" title="Express Backend Status">
            <span class="status-dot"></span>
            <span>Backend: Checking...</span>
          </div>

          <button class="btn btn-secondary btn-sm" id="btn-view-held" title="View Held Bills">
            <span>⏸️ Held Bills</span>
            <span class="badge badge-warning hidden" id="held-bills-count-badge">0</span>
            <span class="nav-shortcut-badge" style="color: var(--text-muted); background: var(--bg-surface-tertiary);">F3</span>
          </button>

          <div class="clock-display">
            <span class="live-indicator"></span>
            <span id="header-live-clock">12:00:00 PM</span>
          </div>
        </div>
      </header>

      <!-- View 1: POS Billing Terminal -->
      <section class="view-container" id="pos-view">
        <div class="pos-catalog-pane">
          <div class="pos-search-bar-wrap">
            <div class="pos-search-box">
              <span class="pos-search-icon">🔍</span>
              <input type="text" id="pos-search-input" class="pos-search-input" placeholder="Search by product name, SKU, or barcode... (Press Enter to add)" autofocus>
              <span class="search-shortcut-hint">F1</span>
            </div>
            <button class="btn btn-secondary barcode-scan-btn" id="pos-barcode-btn" title="Simulate Barcode Scanner">
              <span>📷</span>
              <span>Scan Barcode</span>
            </button>
          </div>

          <div class="category-filter-wrapper">
            <button class="cat-scroll-arrow" id="cat-scroll-left" title="Scroll left">‹</button>
            <div class="category-filter-bar" id="pos-category-bar"></div>
            <button class="cat-scroll-arrow" id="cat-scroll-right" title="Scroll right">›</button>
          </div>

          <div class="product-grid-container" id="pos-product-grid"></div>
        </div>

        <div class="pos-cart-pane">
          <div class="pos-cart-header">
            <div class="cart-title-wrap">
              <h2 style="font-size: 1.1rem; font-weight: 700;">Active Bill</h2>
              <span class="cart-badge-count" id="cart-badge-count">0</span>
            </div>
            <button class="btn btn-ghost btn-sm" id="btn-clear-cart" style="color: var(--danger-600);" title="Clear Cart (F9)">
              🗑️ Clear
            </button>
          </div>

          <div class="cart-customer-bar">
            <div class="customer-info-active">
              <span>👤</span>
              <span id="cart-customer-name">Walk-in Customer</span>
              <span class="hidden" style="margin-left: 4px;"><span class="loyalty-pts-badge" id="cart-customer-points">0 pts</span></span>
            </div>
            <button class="btn btn-secondary btn-sm" id="btn-select-customer">Change</button>
          </div>

          <div class="cart-items-list" id="pos-cart-items"></div>

          <div class="pos-cart-footer">
            <div class="summary-rows">
              <div class="summary-row">
                <span>Subtotal</span>
                <span id="pos-subtotal-val">₹0.00</span>
              </div>
              <div class="summary-row">
                <span>Tax (GST)</span>
                <span id="pos-tax-val">₹0.00</span>
              </div>
              <div class="summary-row">
                <span>Discount</span>
                <span id="pos-discount-val" style="color: var(--success-600);">−₹0.00</span>
              </div>
              <div class="summary-row total-row">
                <span>TOTAL</span>
                <span class="summary-total-amount" id="pos-grand-total-val">₹0.00</span>
              </div>
            </div>

            <div class="pos-action-buttons">
              <button class="btn btn-warning" id="btn-hold-bill">
                <span>⏸️ Hold [F2]</span>
              </button>
              <button class="btn btn-secondary" id="btn-apply-discount">
                <span>🏷️ Discount [F4]</span>
              </button>
              <button class="btn-checkout" id="btn-proceed-pay" disabled>
                <span>⚡ PAY / CHECKOUT [F8]</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Other Views Hidden -->
      <section class="view-container hidden" id="dashboard-view"></section>
      <section class="view-container hidden" id="inventory-view"></section>
      <section class="view-container hidden" id="transactions-view"></section>
      <section class="view-container hidden" id="customers-view"></section>
      <section class="view-container hidden" id="settings-view"></section>

    </main>
  </div>

  <div id="toast-container"></div>

  <!-- Application Scripts (storage.js removed to prevent duplicate DB declarations) -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/pos.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
